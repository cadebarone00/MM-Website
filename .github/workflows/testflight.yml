# Upload to TestFlight (project_specs.md "Upload to TestFlight from GitHub"): builds The Maroon iPhone app on one of
# GitHub's Macs (macOS 26 with Xcode 26, which Apple requires for uploads) and uploads it to App Store Connect, so no
# Mac of our own is needed. Started by hand only: Actions tab → "Upload to TestFlight" → Run workflow.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect → Users and Access → Integrations → App Store Connect API (Admin key)
#   ASC_KEY_P8                  the whole text of that key's .p8 file (downloaded once)
#   APPLE_TEAM_ID               developer.apple.com → Account → Membership details → Team ID
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY    the same public values as .env
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY (optional)                 the Venue maps
#
# Each run's build number is GitHub's run number (1, 2, 3…), so Apple never sees the same one twice.

name: Upload to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the secrets are there
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"; exit 1; fi

      - uses: actions/checkout@v4

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the app's screens
        env:
          MAROON_APP_BUILD: "1"
          NEXT_PUBLIC_APP_BUILD: ${{ github.run_number }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"
        # The same as `npm run build:app`, without the last step (it only restores the website's local type files).
        run: |
          npx next build
          npx cap sync ios

      # The key text is rebuilt from its letters, so copy-paste damage (lost line breaks, extra spaces, missing
      # BEGIN/END lines) doesn't matter. Each secret's shape is checked first, so a wrong paste says which one.
      - name: Put the App Store Connect key on this Mac (removed at the end)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID should be the short Key ID (10 letters and numbers, no dashes or spaces). Paste it again from App Store Connect → Users and Access → Integrations → Team Keys."; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::ASC_ISSUER_ID should be the long Issuer ID with dashes (shown above the Team Keys list). Paste it again."; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          body=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -cd 'A-Za-z0-9+/=')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$key"
          chmod 600 "$key"
          openssl pkey -in "$key" -noout 2>/dev/null || { echo "::error::ASC_KEY_P8 isn't a valid key. Open AuthKey_$ASC_KEY_ID.p8 in TextEdit, copy everything (⌘A, ⌘C) and paste it again. The file's name must match ASC_KEY_ID."; exit 1; }

      # Unsigned here: signing the archive needs a development profile, and Apple won't make one for a team with no
      # registered iPhones ("No profiles for 'site.themaroon.app' were found"). The upload step signs it for the App
      # Store with Apple's cloud signing, which needs no devices.
      - name: Archive (Release, signed in the upload step)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TheMaroon.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TheMaroon.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Build $BUILD_NUMBER uploaded. It shows in App Store Connect → TestFlight once Apple has processed it (usually 10–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from this Mac
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
