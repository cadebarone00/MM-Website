# Isolated LOCAL Supabase for account / signup testing (Accounts Step 2c). Copied into out/auth-local/supabase/ by
# scripts/auth-local/setup.mjs. Its own project id and ports (55xxx), so it never touches the main local stack
# (54xxx) and it has no link to any hosted project. Emails go only to the local Mailpit inbox (no SMTP is set).

project_id = "maroon-auth-test"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 55324

# schema.sql creates a storage bucket, so the storage service stays on.
[storage]
enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3999"
additional_redirect_urls = ["http://127.0.0.1:3999/**", "http://localhost:3999/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# Accounts V2 phase A2: same minimum as the app (lib/auth/passwordPolicy.ts). Supabase caps passwords at 72 bytes.
minimum_password_length = 12

[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000
token_refresh = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
# Production has unverified accounts, so email confirmation is ON there; match it.
enable_confirmations = true
# A2: Supabase also requires a recent sign-in to change a password (recommended for production too).
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Pending accounts Phase 6: the emails carry the 6-digit code as well as the link (local stack only; setup.mjs copies
# scripts/auth-local/templates). Hosted templates are configured separately by the owner.
[auth.email.template.confirmation]
subject = "Confirm your email for The Maroon"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Maroon password"
content_path = "./supabase/templates/recovery.html"
